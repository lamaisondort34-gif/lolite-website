# Configuration Netlify pour LOLITE
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration

[build]
# Commande de build
command = "npm run build"
# Dossier à publier
publish = "dist"

[build.environment]
# Variables d'environnement
NODE_VERSION = "22"

# Redirects pour SPA React
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Headers de sécurité et de cache
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache pour les assets (fonts, images, js)
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Cache pour les fichiers CSS et JS
[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Content-Type = "text/css"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Content-Type = "application/javascript"

# Pas de cache pour le HTML
[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

# Compression GZIP (automatique sur Netlify)
[context.production]
command = "npm run build"
publish = "dist"

[context.deploy-preview]
command = "npm run build"
publish = "dist"

[context.branch-deploy]
command = "npm run build"
publish = "dist"
