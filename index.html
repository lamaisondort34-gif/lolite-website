<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Décide avant l'affichage s'il faut jouer l'intro (cf. public/boot.js) -->
    <script src="/boot.js"></script>

    <!-- SEO : title, description et canonical sont réécrits par page au build (scripts/postbuild.mjs) -->
    <title>LOLITE — Création de sites vitrines sur-mesure à Montpellier | Livrés en 14 jours</title>
    <meta name="description" content="Studio web à Montpellier : sites vitrines sur-mesure, rapides et optimisés pour Google, livrés en 1 à 2 semaines dès 450 €. Devis gratuit sous 24–48h, partout en France et DOM-TOM." />
    <link rel="canonical" href="https://lolite.fr/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="LOLITE Studio Web" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LOLITE Studio Web" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://lolite.fr/" />
    <meta property="og:title" content="LOLITE — Création de sites vitrines sur-mesure à Montpellier | Livrés en 14 jours" />
    <meta property="og:description" content="Studio web à Montpellier : sites vitrines sur-mesure, rapides et optimisés pour Google, livrés en 1 à 2 semaines dès 450 €. Devis gratuit sous 24–48h, partout en France et DOM-TOM." />
    <meta property="og:image" content="https://lolite.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LOLITE — Des sites web d'exception, livrés en 14 jours. Dès 450 €, devis gratuit." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LOLITE — Création de sites vitrines sur-mesure à Montpellier | Livrés en 14 jours" />
    <meta name="twitter:description" content="Studio web à Montpellier : sites vitrines sur-mesure, rapides et optimisés pour Google, livrés en 1 à 2 semaines dès 450 €. Devis gratuit sous 24–48h, partout en France et DOM-TOM." />
    <meta name="twitter:image" content="https://lolite.fr/og-image.jpg" />

    <!-- Données structurées (fiche entreprise pour Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "LOLITE Studio Web",
        "url": "https://lolite.fr/",
        "logo": "https://lolite.fr/icon-512.png",
        "image": "https://lolite.fr/og-image.jpg",
        "description": "Création de sites vitrines sur-mesure, livrés en 1 à 2 semaines.",
        "telephone": "+33663530157",
        "priceRange": "€€",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "164 rue des Eucalyptus",
          "postalCode": "34090",
          "addressLocality": "Montpellier",
          "addressCountry": "FR"
        },
        "areaServed": ["FR", "GP", "MQ", "GF", "RE", "YT"],
        "sameAs": [
          "https://www.instagram.com/lolite.web/",
          "https://www.facebook.com/61584097673940"
        ]
      }
    </script>

  </head>
  <body>

    <!-- Formulaire « fantôme » : permet à Netlify Forms de détecter le brief au déploiement. -->
    <form name="brief" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="contact" />
      <input name="type" />
      <input name="budget" />
      <textarea name="message"></textarea>
    </form>

    <!-- Intro de la 1re visite (cf. public/boot.js et src/index.css) : affichée seulement
         avec html.intro, décorative, sans texte dans le HTML (textes en CSS, non indexés). -->
    <div class="intro-curtain fixed inset-0 z-[400] flex-col justify-between overflow-hidden bg-ink px-6 py-6 md:px-10 md:py-8" aria-hidden="true">
      <div class="flex items-center justify-between font-mono text-[11px] uppercase tracking-[0.25em] text-fog">
        <span class="intro-studio"></span>
        <span class="intro-loading hidden sm:block"></span>
        <span class="intro-est"></span>
      </div>
      <div class="flex items-center justify-center">
        <div class="overflow-hidden">
          <div class="intro-logo h-[28vw] max-h-[260px] sm:h-[22vw]"></div>
        </div>
      </div>
      <div class="flex items-end justify-between">
        <p class="intro-tagline max-w-[220px] font-mono text-[11px] uppercase leading-relaxed tracking-[0.2em] text-fog"></p>
        <span class="font-display text-6xl font-bold tabular-nums text-lime md:text-8xl"><span class="intro-count"></span><span class="intro-pct text-2xl align-top md:text-4xl"></span></span>
      </div>
      <div class="intro-bar absolute bottom-0 left-0 h-[3px] w-full bg-lime"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
