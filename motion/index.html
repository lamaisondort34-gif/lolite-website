<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>LOLITE — film 45 s</title>
<style>
  @font-face { font-family: "Bricolage"; font-weight: 200 800; font-stretch: 75% 100%;
    src: url(/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2) format("woff2-variations"); }
  @font-face { font-family: "Bricolage"; font-weight: 200 800; font-stretch: 75% 100%;
    src: url(/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-ext-standard-normal.woff2) format("woff2-variations");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Outfit"; font-weight: 100 900;
    src: url(/node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2) format("woff2-variations"); }
  @font-face { font-family: "Instrument"; font-style: italic; font-weight: 400;
    src: url(/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "Instrument"; font-style: normal; font-weight: 400;
    src: url(/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Mono"; font-weight: 400;
    src: url(/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Mono"; font-weight: 500;
    src: url(/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Mono"; font-weight: 700;
    src: url(/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }

  :root {
    --ink: #16102b; --night: #0b0718; --bg: #fafafd; --pale: #f1edf9;
    --v: #7c3aed; --vd: #6d28d9; --v9: #4c1d95; --vl: #a78bfa; --vll: #c4b5fd; --fog: #5e5872;
    --amber: #ffb547; --red: #ff4d6d; --green: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--night);
    font-family: "Outfit", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .layer, .scene { position: absolute; inset: 0; }
  .scene { display: none; }
  .abs { position: absolute; }
  .disp { font-family: "Bricolage", sans-serif; font-weight: 800; letter-spacing: -0.035em; line-height: 0.96; }
  .serif { font-family: "Instrument", serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: "Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }
  .center { left: 0; right: 0; text-align: center; }
  .wm { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.04em 0.14em; margin: -0.06em -0.04em -0.14em; }
  .wi { display: inline-block; will-change: transform; }
  .ch { display: inline-block; white-space: pre; }
  svg { overflow: visible; }
  .ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .glass { background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.12); }
  .card { background: #fff; border-radius: 36px; box-shadow: 0 30px 80px -20px rgba(76,29,149,0.28), 0 2px 0 rgba(22,16,43,0.04); }
  .chip { display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 999px; font: 600 34px "Outfit"; white-space: nowrap; }
  img { display: block; }
  #fx, #grain { pointer-events: none; }
</style>
</head>
<body>
  <div id="stage">
    <div id="bg" class="layer"></div>
    <div id="cam" class="layer"></div>
    <canvas id="fx" class="layer" width="1080" height="1920"></canvas>
    <div id="wipes" class="layer"></div>
    <div id="hud" class="layer"></div>
    <canvas id="grain" class="layer" width="540" height="960" style="width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.5"></canvas>
    <div id="vignette" class="layer"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
